[project]
name = "bookshelf"
version = "0.1.0"
description = "Personal library: ingest ISBNs, enrich from Google Books, browse and filter."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bookshelf = "bookshelf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
