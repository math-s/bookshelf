<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan books · Bookshelf</title>
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  .scanwrap { max-width: 620px; margin: 0 auto; padding: 16px; }
  .viewport {
    position: relative;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .viewport video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle {
    position: absolute;
    inset: 26% 12%;
    border: 2px solid rgb(255 255 255 / 75%);
    border-radius: 8px;
    box-shadow: 0 0 0 100vmax rgb(0 0 0 / 28%);
  }
  .viewport .status {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    background: rgb(0 0 0 / 55%);
    color: #fff;
    font-size: 13px;
  }
  .queue { margin-top: 16px; }
  .queue li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
  }
  .queue li .dup { font-family: inherit; color: var(--muted); font-size: 12px; }
  .queue ul { list-style: none; margin: 0; padding: 0; }
  .notice {
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    background: var(--panel);
    font-size: 13.5px;
  }
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Scan books</div>
  <div class="spacer"></div>
  <a href="./index.html"><button>← Library</button></a>
</header>

<div class="scanwrap">
  <div id="notice" class="notice" hidden></div>

  <div class="viewport">
    <video id="video" playsinline muted></video>
    <div class="reticle"></div>
    <div class="status" id="status">Starting camera…</div>
  </div>

  <div style="display:flex;gap:8px;margin-top:12px">
    <button id="start" class="primary">Start camera</button>
    <button id="stop" hidden>Stop</button>
    <div class="spacer"></div>
    <button id="import" class="primary" hidden>Add 0 books</button>
  </div>

  <div class="manual">
    <input id="manual-input" type="text" inputmode="numeric" placeholder="…or type an ISBN by hand">
    <button id="manual-add">Add</button>
  </div>

  <div class="queue">
    <h3 style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Queue</h3>
    <ul id="queue"></ul>
    <p id="queue-empty" style="color:var(--muted);font-size:13.5px">Nothing scanned yet.</p>
  </div>

  <div id="report" class="report"></div>
</div>

<script type="module" src="./scan.js"></script>
</body>
</html>
