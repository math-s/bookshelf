<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf</title>
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">Bookshelf <small id="count"></small></div>
  <input id="q" class="search" type="search" placeholder="Search title, author, publisher…" autocomplete="off">
  <div class="spacer"></div>
  <div class="viewtoggle">
    <button id="view-grid" aria-pressed="true" title="Grid view">Grid</button>
    <button id="view-table" aria-pressed="false" title="Table view">Table</button>
    <button id="view-author" aria-pressed="false" title="Group by author">By author</button>
  </div>
  <button id="open-import">Add ISBNs</button>
  <a href="./scan.html"><button title="Scan barcodes with your camera">Scan</button></a>
  <button id="open-settings" title="API server and access token">⚙</button>
</header>

<div class="layout">
  <aside>
    <h3>Status</h3>
    <div id="facet-status"></div>

    <h3>Rating</h3>
    <div id="facet-rating"></div>

    <h3>Tags</h3>
    <div id="facet-tags" class="chips"></div>

    <h3>Author</h3>
    <div id="facet-authors"></div>

    <h3 id="reset-wrap" hidden><button class="linkish" id="reset">Clear all filters</button></h3>
  </aside>

  <main>
    <div class="resultbar">
      <span id="summary"></span>
      <label id="multi-only" class="inline-toggle" hidden>
        <input type="checkbox" id="min-books"> Only authors with 2+ books
      </label>
      <div class="spacer"></div>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="added">Recently added</option>
        <option value="rating">Rating</option>
        <option value="published">Published</option>
        <option value="pages">Pages</option>
      </select>
      <select id="order">
        <option value="asc">Asc</option>
        <option value="desc">Desc</option>
      </select>
    </div>

    <div id="results"></div>
  </main>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
